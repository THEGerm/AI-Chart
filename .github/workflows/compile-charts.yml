name: Compile Charts

on:
  push:
    branches:
      - main
    paths:
      - 'Projects/GERM-DEV-0014/charts/**.mmd'
      - 'style.css'
      - '.github/workflows/compile-charts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Configure Puppeteer for GitHub Actions
        run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json

      - name: Ensure output directory exists
        run: mkdir -p Projects/GERM-DEV-0014/assets/images

      - name: Compile Charts to PNG
        run: |
          CSS_ARG=""
          if [ -f "Projects/GERM-DEV-0014/style.css" ]; then
            CSS_ARG="-C Projects/GERM-DEV-0014/style.css"
          fi

          for file in Projects/GERM-DEV-0014/charts/*.mmd; do
            [ -e "$file" ] || continue
            filename=$(basename "$file" .mmd)
            echo "Compiling $file to Projects/GERM-DEV-0014/assets/images/${filename}.png"
            mmdc -p puppeteer-config.json -i "$file" -o "Projects/GERM-DEV-0014/assets/images/${filename}.png" -s 4 $CSS_ARG
          done

      - name: Commit and push generated images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Projects/GERM-DEV-0014/assets/images/*.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-compile charts to PNG [skip ci]"
            git push
          fi
          
