name: Senet tests

on:
  push:
    paths:
      - 'Projects/GERM-DEV-0031/**'
      - '.github/workflows/senet.yml'
  pull_request:
    paths:
      - 'Projects/GERM-DEV-0031/**'
      - '.github/workflows/senet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Rule tests
        run: node --test Projects/GERM-DEV-0031/tests/*.test.js
      - name: Playability table
        run: node Projects/GERM-DEV-0031/tests/playability.js 200
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python engine parity with the JavaScript engine
        working-directory: Projects/GERM-DEV-0031
        run: python -m unittest sweep/test_parity.py
