<!doctype html>
<!--
  ANCIENT EGYPT, ONE IMAGE PER KINGDOM
  A simulated four-ink risograph sheet. Every scene, person, object and ink dot is drawn in code.
  One file, Canvas 2D, no images, no fonts, no libraries, no network.

  CHAPTERS (chronological, one isometric cut-away diorama each)
   I.   The Old Kingdom        Dynasties III-VI      c. 2686-2181 BCE
        Khufu raises the Great Pyramid, Giza, c. 2560 BCE.
        Pharaoh (hidden): the red-ochre gang mark "Friends of Khufu" in a cartouche on the hauled block.
   II.  The Middle Kingdom     Dynasties XI-XIV      c. 2055-1650 BCE
        A royal sculptors' workshop finishing a granite statue of Senusret III, c. 1850 BCE.
        Pharaoh (obvious): the careworn granite king himself, still on the grid.
   III. The New Kingdom        Dynasties XVIII-XX    c. 1550-1069 BCE
        A banquet at Pi-Ramesses, Ramesses II and Queen Nefertari, c. 1250 BCE.
        Pharaoh (obvious): enthroned on the dais in the blue crown; his name also on the wine jars.
   IV.  The Late Period        Dynasties XXVI-XXXI   664-332 BCE
        The Greek port of Naukratis on the Nile, year 1 of Nectanebo I, 380 BCE.
        Pharaoh (engraving): the Naukratis stela, the king offering to the goddess Neith.
   V.   The Ptolemaic Kingdom  Dynasties XXXII-XXXIII 332-30 BCE
        The Library of Alexandria by lamplight, Cleopatra VII visiting (an imagined scene), c. 40 BCE.
        Pharaoh (obvious + hidden): the queen in her diadem; her coin on the copyist's desk.
   VI.  Roman Egypt            Emperors as pharaohs  30 BCE-395 CE
        Moonlight at Philae, temple of Isis, reign of Augustus, c. 10 BCE.
        Pharaoh (carving): Augustus as pharaoh offering to Isis, cartouche "Kaisaros", on the pylon.

  Controls: drag to pan (with inertia), wheel or pinch to zoom, double-click / double-tap a scene to fly
  to it, arrow keys pan, + / - zoom, 0 fits the sheet, C toggles the chapter card.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Ancient Egypt, one image per Kingdom</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a2622;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#card{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:min(380px,calc(100vw - 44px));box-sizing:border-box;padding:30px 30px 26px;color:#22325f;pointer-events:none;opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);box-shadow:0 14px 40px rgba(0,0,0,.38);font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
#card.on{opacity:1;transform:none}
#cb{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#card>div,#card>h1,#card>p,#cg{position:relative;z-index:1}
#ck{font-variant:small-caps;letter-spacing:.14em;font-size:14px;color:#c8452e;text-transform:lowercase}
#ct{font-weight:400;font-size:clamp(30px,4.4vw,40px);line-height:1.02;margin:6px 0 4px;letter-spacing:-.01em}
#cg{display:block;width:100%;height:58px;margin:4px 0 6px}
#cs{font-style:italic;font-size:15px;line-height:1.35;margin-bottom:8px}
#cd{font-size:14.5px;line-height:1.5;margin:0;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
#cd::first-letter{float:left;font-size:44px;line-height:.9;padding:4px 6px 0 0;color:#c8452e}
@media (max-width:640px),(max-height:520px){
 #card{left:10px;right:10px;bottom:10px;width:auto;padding:18px 18px 16px}
 #ck{font-size:12px}#ct{font-size:27px}#cs{font-size:13px;margin-bottom:5px}#cd{font-size:12.5px;line-height:1.42}
 #cd::first-letter{font-size:34px}#cg{height:44px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="card"><canvas id="cb"></canvas><div id="ck"></div><h1 id="ct"></h1><canvas id="cg"></canvas><div id="cs"></div><p id="cd"></p></div>
<script>
'use strict';
/* ======================================================================
   1. PRESS: inks, paper, seeded randomness, noise
   ====================================================================== */
const TAU = Math.PI * 2, D2R = Math.PI / 180, C30 = Math.cos(Math.PI / 6);
// Four spot inks. a = screen angle (deg), o = misregistration of the drum (sheet units).
const INKS = [
  { n: 'Lapis',     hex: '#21327a', c: [33, 50, 122],  a: 45, o: [0, 0] },
  { n: 'Carnelian', hex: '#d9472e', c: [217, 71, 46],  a: 75, o: [0.95, -0.6] },
  { n: 'Ochre',     hex: '#f0b232', c: [240, 178, 50], a: 0,  o: [-0.7, 0.85] },
  { n: 'Turquoise', hex: '#18a09c', c: [24, 160, 156], a: 15, o: [0.6, 1.0] },
];
const PAPER = [246, 237, 215];
const CELL = 2.1;                       // halftone cell, sheet units
const ABS = INKS.map(k => k.c.map(v => 1 - v / 255));

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash3(a, b, c) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177); h ^= h >>> 16;
  return h >>> 0;
}

// Tileable value noise, 256 x 256, normalised to 0..1. Used for paper grain, ink density and dropout.
const NS = 256, NM = 255, NZ = new Float32Array(NS * NS);
(function () {
  const r = mulberry(1979);
  const oct = [[64, 0.34], [32, 0.24], [16, 0.17], [8, 0.12], [4, 0.08], [2, 0.05]];
  for (const [P, w] of oct) {
    const L = NS / P, g = new Float32Array(L * L);
    for (let i = 0; i < g.length; i++) g[i] = r();
    for (let y = 0; y < NS; y++) {
      const gy = y / P, y0 = Math.floor(gy), fy = gy - y0, sy = fy * fy * (3 - 2 * fy);
      for (let x = 0; x < NS; x++) {
        const gx = x / P, x0 = Math.floor(gx), fx = gx - x0, sx = fx * fx * (3 - 2 * fx);
        const a = g[(y0 % L) * L + x0 % L], b = g[(y0 % L) * L + (x0 + 1) % L];
        const c = g[((y0 + 1) % L) * L + x0 % L], d = g[((y0 + 1) % L) * L + (x0 + 1) % L];
        NZ[y * NS + x] += w * (a + (b - a) * sx + (c + (d - c) * sx - a - (b - a) * sx) * sy);
      }
    }
  }
  let lo = 1e9, hi = -1e9;
  for (const v of NZ) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  for (let i = 0; i < NZ.length; i++) NZ[i] = (NZ[i] - lo) / (hi - lo);
})();
function nz(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const x0 = xi & NM, y0 = yi & NM, x1 = (x0 + 1) & NM, y1 = (y0 + 1) & NM;
  const a = NZ[y0 * NS + x0], b = NZ[y0 * NS + x1], c = NZ[y1 * NS + x0], d = NZ[y1 * NS + x1];
  const t = a + (b - a) * fx;
  return t + (c + (d - c) * fx - t) * fy;
}
const COS = new Float32Array(1024);
for (let i = 0; i < 1024; i++) COS[i] = Math.cos(i / 1024 * TAU);

/* ======================================================================
   2. SEPARATIONS -> HALFTONE
   Coverage for the four inks is painted as greyscale into two canvases:
     A.rgb = Lapis, Carnelian, Ochre      B.r = Turquoise, B.g = object mask
   A knock-out fill paints every channel (so it erases what is behind it);
   an overprint uses 'lighter' on only its own channels.
   shade() turns those separations into a printed sheet: per-ink rotated
   amplitude-modulated dot screens with jitter, drum misregistration,
   uneven density, dropout in solids, multiply over grained cream paper.
   ====================================================================== */
function shade(A, B, wA, m, out, w, h, ox, oy, p, sprite, alpha) {
  const inv = 1 / p, cpx = CELL * p;
  const dm = cpx < 1.6 ? 0 : cpx > 3.4 ? 1 : (cpx - 1.6) / 1.8;   // dots vs. averaged tone
  const K = Math.max(1, cpx * 0.6);                                 // dot edge sharpness
  const ca = [], sa = [], sx = [], sy = [];
  for (let k = 0; k < 4; k++) {
    const a = INKS[k].a * D2R;
    ca[k] = Math.cos(a) / CELL; sa[k] = Math.sin(a) / CELL;
    sx[k] = Math.round(INKS[k].o[0] * p); sy[k] = Math.round(INKS[k].o[1] * p);
  }
  const o = out.data, ow = sprite ? w * 2 : w;
  for (let j = 0; j < h; j++) {
    const wy = oy + (j + 0.5) * inv;
    for (let i = 0; i < w; i++) {
      const wx = ox + (i + 0.5) * inv;
      let r = 1, g = 1, b = 1, any = 0;
      if (sprite) {   // most of a sprite's box is empty: skip it fast
        const q0 = (j * ow + i) * 4, mk0 = B[((j + m) * wA + i + m) * 4 + 1];
        let e = mk0;
        for (let k = 0; k < 4 && !e; k++) { const idx = ((j + m - sy[k]) * wA + (i + m - sx[k])) * 4; e = k < 3 ? A[idx + k] > 2 : B[idx] > 2; }
        if (!e) { o[q0 + 3] = 0; o[q0 + w * 4 + 3] = 0; continue; }
      }
      const n1 = nz(wx * 0.045, wy * 0.045), n2 = nz(wx * 0.045 + 61, wy * 0.045 + 23);
      for (let k = 0; k < 4; k++) {
        const idx = ((j + m - sy[k]) * wA + (i + m - sx[k])) * 4;
        let c = k < 3 ? A[idx + k] : B[idx];
        if (c < 3) continue;
        c = c / 255 * alpha;
        // uneven ink laydown across the drum
        c *= 0.88 + 0.22 * (k === 0 ? n1 : k === 1 ? n2 : k === 2 ? 1 - n1 : 1 - n2);
        let cc = c;
        if (dm > 0) {
          const u = wx * ca[k] + wy * sa[k], v = wy * ca[k] - wx * sa[k];
          const iu = Math.floor(u + 0.5), iv = Math.floor(v + 0.5);
          const hh = hash3(iu, iv, k);
          const fu = u - iu - ((hh & 255) / 255 - 0.5) * 0.18;
          const fv = v - iv - (((hh >>> 8) & 255) / 255 - 0.5) * 0.18;
          const s = 0.5 + 0.25 * (COS[(fu * 1024 | 0) & 1023] + COS[(fv * 1024 | 0) & 1023]);
          const cj = c * (1 + (((hh >>> 16) & 255) / 255 - 0.5) * 0.16) * 1.1 - 0.035;
          let d = (cj - (1 - s)) * K + 0.5;
          d = d < 0 ? 0 : d > 1 ? 1 : d;
          if (c > 0.95) d = 1;
          cc = c + (d - c) * dm;
        }
        if (c > 0.6) {           // dropout: the drum starves in big solids
          const q = nz(wx * 0.5 + k * 97, wy * 0.5 + k * 13) * 0.55 + nz(wx * 2.4 + k * 7, wy * 2.4 + k * 41) * 0.45;
          const lim = 0.36 * (c - 0.6) / 0.4;
          if (q < lim) cc *= 0.15 + 0.85 * (q / lim) * (q / lim);
        }
        if (cc <= 0) continue;
        const a = ABS[k];
        r *= 1 - cc * a[0]; g *= 1 - cc * a[1]; b *= 1 - cc * a[2]; any = 1;
      }
      const pg = 0.955 + 0.045 * nz(wx * 1.9, wy * 1.9) + 0.03 * (nz(wx * 0.21 + 90, wy * 0.21 + 30) - 0.5);
      if (!sprite) {
        const q = (j * ow + i) * 4;
        o[q] = PAPER[0] * pg * r; o[q + 1] = PAPER[1] * pg * g; o[q + 2] = PAPER[2] * pg * b; o[q + 3] = 255;
      } else {
        const mk = B[((j + m) * wA + i + m) * 4 + 1] / 255 * alpha;
        const q = (j * ow + i) * 4, q2 = q + w * 4;
        o[q] = PAPER[0] * pg * r; o[q + 1] = PAPER[1] * pg * g; o[q + 2] = PAPER[2] * pg * b; o[q + 3] = mk * 255;
        o[q2] = 255 * r; o[q2 + 1] = 255 * g; o[q2 + 2] = 255 * b; o[q2 + 3] = any ? (1 - mk) * 255 : 0;
      }
    }
  }
}

/* ======================================================================
   3. PEN: a display list of inked polygons, with hand-drawn wobble.
   Layout randomness is seeded per scene; wobble is seeded per scene,
   per op and per boil variant, so the three variants differ only in
   the hand, never in the drawing.
   ====================================================================== */
const LINE = [1, 0, 0, 0];
function inkStr(i, ko) {
  const A = 'rgb(' + (i[0] * 255 | 0) + ',' + (i[1] * 255 | 0) + ',' + (i[2] * 255 | 0) + ')';
  const B = (ko || i[3] > 0) ? 'rgb(' + (i[3] * 255 | 0) + ',' + (ko ? 255 : 0) + ',0)' : null;
  return [A, B];
}
const INKCACHE = new Map();
function inkS(i, ko) {
  const key = i[0].toFixed(3) + i[1].toFixed(3) + i[2].toFixed(3) + i[3].toFixed(3) + (ko ? 'k' : 'o');
  let v = INKCACHE.get(key);
  if (!v) { v = inkStr(i, ko); INKCACHE.set(key, v); }
  return v;
}
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t]; }
function shd(i, a, warm) { // darken with lapis (and a little carnelian if warm)
  const w = warm == null ? 0.25 : warm;
  return [Math.min(1, i[0] + a), Math.min(1, i[1] + a * w), i[2], i[3]];
}
function tint(i, s) { return [i[0] * s, i[1] * s, i[2] * s, i[3] * s]; }

class Pen {
  constructor(seed, v, lod) {
    this.ops = []; this.seed = seed; this.v = v; this.n = 0; this.lod = lod == null ? 1 : lod;
    this.ws = 1; this.alpha = 1;
  }
  wr() { return mulberry(hash3(this.seed, this.n++, this.v * 7919 + 13)); }
  push(pts, ink, ko) {
    if (this.alpha < 1) ink = tint(ink, this.alpha);
    if (!ko && ink[0] + ink[1] + ink[2] + ink[3] <= 0) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < pts.length; i += 2) {
      const x = pts[i], y = pts[i + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    const s = inkS(ink, ko);
    this.ops.push({ p: pts instanceof Float32Array ? pts : new Float32Array(pts), a: s[0], b: s[1], ko: !!ko, x0, y0, x1, y1, path: null });
  }
  // closed filled polygon; o: {ko, wob, line, lw, li}
  poly(pts, ink, o) {
    o = o || {};
    const r = this.wr();
    const amp = (o.wob == null ? 0.35 : o.wob) * this.ws;
    const q = amp > 0 && this.lod > 0.5 ? wobble(pts, true, amp, r, o.step || 4) : pts;
    this.push(q, ink, o.ko !== false);
    if (o.line) this.outline(pts, o.line, o.li || LINE, o.lwob);
  }
  // tapered, wobbling stroke along an open polyline
  stroke(pts, w, ink, o) {
    o = o || {};
    if (pts.length < 4) return;
    const r = this.wr();
    const amp = (o.wob == null ? 0.42 : o.wob) * this.ws;
    const ext = o.ext == null ? 0.5 : o.ext;
    let P = pts.slice();
    if (ext > 0 && this.lod > 0.5) {  // hand overshoot
      const n = P.length;
      let dx = P[0] - P[2], dy = P[1] - P[3], l = Math.hypot(dx, dy) || 1, e = ext * r() * w;
      P[0] += dx / l * e; P[1] += dy / l * e;
      dx = P[n - 2] - P[n - 4]; dy = P[n - 1] - P[n - 3]; l = Math.hypot(dx, dy) || 1; e = ext * r() * w;
      P[n - 2] += dx / l * e; P[n - 1] += dy / l * e;
    }
    const L = plen(P, false);
    if (L < 0.01) return;
    const step = Math.max(0.6, Math.min(3.2, L / 10));
    const S = resample(P, false, step);
    const N = S.length / 2;
    const f1 = 0.06 + r() * 0.07, f2 = 0.17 + r() * 0.12, f3 = 0.05 + r() * 0.08;
    const p1 = r() * TAU, p2 = r() * TAU, p3 = r() * TAU;
    const left = new Float32Array(N * 2), right = new Float32Array(N * 2);
    const taper = o.taper !== false, tmin = o.tmin == null ? 0.18 : o.tmin;
    let s = 0;
    for (let i = 0; i < N; i++) {
      const ia = Math.max(0, i - 1), ib = Math.min(N - 1, i + 1);
      let tx = S[ib * 2] - S[ia * 2], ty = S[ib * 2 + 1] - S[ia * 2 + 1];
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      if (i > 0) s += Math.hypot(S[i * 2] - S[i * 2 - 2], S[i * 2 + 1] - S[i * 2 - 1]);
      const t = N > 1 ? i / (N - 1) : 0.5;
      let tw = 1;
      if (taper) tw = tmin + (1 - tmin) * Math.pow(Math.min(1, t / 0.24), 0.6) * Math.pow(Math.min(1, (1 - t) / 0.24), 0.6);
      const hw = w * 0.5 * tw * (1 + 0.2 * Math.sin(s * f3 + p3));
      const off = this.lod > 0.5 ? amp * (0.65 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2)) : 0;
      const cx = S[i * 2] - ty * off, cy = S[i * 2 + 1] + tx * off;
      left[i * 2] = cx - ty * hw; left[i * 2 + 1] = cy + tx * hw;
      right[i * 2] = cx + ty * hw; right[i * 2 + 1] = cy - tx * hw;
    }
    const poly = new Float32Array(N * 4);
    poly.set(left, 0);
    for (let i = 0; i < N; i++) { poly[N * 2 + i * 2] = right[(N - 1 - i) * 2]; poly[N * 2 + i * 2 + 1] = right[(N - 1 - i) * 2 + 1]; }
    this.push(poly, ink || LINE, !!o.ko);
  }
  // hand-drawn outline of a closed polygon: a few overlapping tapered strokes
  outline(pts, w, ink, wob) {
    const n = pts.length / 2;
    if (this.lod < 0.6 || n > 8) {
      const L = plen(pts, true);
      const k = this.lod < 0.6 ? 1 : Math.max(2, Math.min(4, Math.round(L / 60)));
      const S = resample(pts, true, Math.max(1, L / 64));
      const M = S.length / 2;
      for (let c = 0; c < k; c++) {
        const a = Math.floor(c * M / k), b = Math.floor((c + 1) * M / k) + (k > 1 ? 2 : 1);
        const seg = [];
        for (let i = a; i <= b; i++) { const j = i % M; seg.push(S[j * 2], S[j * 2 + 1]); }
        this.stroke(seg, w, ink, { wob: wob, ext: 0.3 });
      }
    } else {
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        this.stroke([pts[i * 2], pts[i * 2 + 1], pts[j * 2], pts[j * 2 + 1]], w, ink, { wob: wob, ext: 0.9 });
      }
    }
  }
  ell(cx, cy, rx, ry, ink, o) { this.poly(ellipse(cx, cy, rx, ry, (o && o.rot) || 0, Math.max(10, Math.min(40, (rx + ry) * 0.8 | 0))), ink, o); }
  dot(cx, cy, r, ink, ko) { this.push(ellipse(cx, cy, r, r, 0, 8), ink, !!ko); }
  // stepped halftone light: concentric rings that overprint, so ink steps up toward the source
  rings(cx, cy, r0, r1, n, ink, sy) {
    sy = sy || 1;
    for (let i = 0; i < n; i++) {
      const rr = r1 - (r1 - r0) * i / (n - 1 || 1);
      this.poly(ellipse(cx, cy, rr, rr * sy, 0, 40), ink, { ko: false, wob: 0.6 });
    }
  }
}

function plen(P, closed) {
  let L = 0;
  for (let i = 2; i < P.length; i += 2) L += Math.hypot(P[i] - P[i - 2], P[i + 1] - P[i - 1]);
  if (closed) L += Math.hypot(P[0] - P[P.length - 2], P[1] - P[P.length - 1]);
  return L;
}
function resample(P, closed, step) {
  const out = [];
  const n = P.length / 2, segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const ax = P[i * 2], ay = P[i * 2 + 1], j = (i + 1) % n, bx = P[j * 2], by = P[j * 2 + 1];
    const l = Math.hypot(bx - ax, by - ay), k = Math.max(1, Math.ceil(l / step));
    for (let s = 0; s < k; s++) out.push(ax + (bx - ax) * s / k, ay + (by - ay) * s / k);
  }
  if (!closed) out.push(P[P.length - 2], P[P.length - 1]);
  return out;
}
function wobble(P, closed, amp, r, step) {
  const S = resample(P, closed, step);
  const N = S.length / 2;
  const f1 = 0.05 + r() * 0.06, f2 = 0.15 + r() * 0.1, p1 = r() * TAU, p2 = r() * TAU;
  const out = new Float32Array(S.length);
  let s = 0;
  for (let i = 0; i < N; i++) {
    const ia = (i - 1 + N) % N, ib = (i + 1) % N;
    let tx = S[ib * 2] - S[ia * 2], ty = S[ib * 2 + 1] - S[ia * 2 + 1];

function paintCard(i) {
  const C = CHAPTERS[i]; if (!C) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  // paper grain on the card stock, from the same noise as the sheet
  const cb = document.getElementById('cb');
  const w = Math.max(1, Math.round(elCard.offsetWidth * dpr)), h = Math.max(1, Math.round(elCard.offsetHeight * dpr));
  if (cb.width !== w || cb.height !== h || cb.dataset.k !== String(i)) {
    cb.width = w; cb.height = h; cb.dataset.k = String(i);
    const c = cb.getContext('2d'), im = c.createImageData(w, h), o = im.data;
    const acc = ABS[1], s = 1 / dpr;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const wx = x * s * 0.55 + i * 300, wy = y * s * 0.55;
      const pg = 0.955 + 0.045 * nz(wx * 1.9, wy * 1.9) + 0.03 * (nz(wx * 0.21 + 90, wy * 0.21 + 30) - 0.5);
      // a halftone fade of the accent ink along the foot of the card
      const f = Math.max(0, (y - (h - 9 * dpr)) / (9 * dpr));
      const u = (x * 0.966 + y * 0.259) / (4.2 * dpr), v = (y * 0.966 - x * 0.259) / (4.2 * dpr);
      const sp = 0.5 + 0.25 * (Math.cos(u * TAU) + Math.cos(v * TAU));
      const d = f * 0.55 > 1 - sp ? 1 : 0;
      const q = (y * w + x) * 4;
      o[q] = PAPER[0] * pg * (1 - d * acc[0] * 0.9); o[q + 1] = PAPER[1] * pg * (1 - d * acc[1] * 0.9); o[q + 2] = PAPER[2] * pg * (1 - d * acc[2] * 0.9); o[q + 3] = 255;
    }
    c.putImageData(im, 0, 0);
    // a thin double rule, the outer in lapis, the inner in carnelian, slightly off register
    c.lineWidth = 1 * dpr; c.strokeStyle = INKS[0].hex; c.strokeRect(9 * dpr, 9 * dpr, w - 18 * dpr, h - 18 * dpr);
    c.strokeStyle = INKS[1].hex; c.globalAlpha = 0.9; c.strokeRect(13.6 * dpr, 12.8 * dpr, w - 26 * dpr, h - 26 * dpr); c.globalAlpha = 1;
  }
  // the rule and the cartouche
  const cg = document.getElementById('cg');
  const gw = Math.max(1, Math.round(cg.offsetWidth * dpr)), gh = Math.max(1, Math.round(cg.offsetHeight * dpr));
  cg.width = gw; cg.height = gh;
  const c = cg.getContext('2d');
  c.clearRect(0, 0, gw, gh);
  const cols = C.g, ws = cols.map((col) => Math.max(...col.map((g) => GW[g] || 0.85)));
  const gs = Math.min(gh * 0.62, (gw * 0.66) / (ws.reduce((a, b) => a + b, 0) + 1.2));
  const cwid = ws.reduce((a, b) => a + b, 0) * gs + gs * 0.9, chei = gs * 1.32;
  const x0 = (gw - cwid) / 2, y0 = (gh - chei) / 2;
  const ink = (k, dx, dy) => { c.save(); c.translate(dx, dy); c.fillStyle = c.strokeStyle = INKS[k].hex; return c; };
  // rule with printer's lozenges
  ink(1, 0.7 * dpr, 0.5 * dpr);
  c.lineWidth = 1.1 * dpr;
  c.beginPath(); c.moveTo(2 * dpr, gh / 2); c.lineTo(x0 - 12 * dpr, gh / 2); c.moveTo(x0 + cwid + 12 * dpr, gh / 2); c.lineTo(gw - 2 * dpr, gh / 2); c.stroke();
  for (const x of [x0 - 7 * dpr, x0 + cwid + 7 * dpr, 4 * dpr, gw - 4 * dpr]) { c.beginPath(); c.moveTo(x, gh / 2 - 4 * dpr); c.lineTo(x + 3.5 * dpr, gh / 2); c.lineTo(x, gh / 2 + 4 * dpr); c.lineTo(x - 3.5 * dpr, gh / 2); c.fill(); }
  // cartouche ring and tie
  c.lineWidth = 1.8 * dpr;
  const r = chei / 2;
  c.beginPath(); c.moveTo(x0 + r, y0); c.lineTo(x0 + cwid - r, y0); c.arc(x0 + cwid - r, y0 + r, r, -Math.PI / 2, Math.PI / 2); c.lineTo(x0 + r, y0 + chei); c.arc(x0 + r, y0 + r, r, Math.PI / 2, Math.PI * 1.5); c.stroke();
  c.lineWidth = 2.6 * dpr; c.beginPath(); c.moveTo(x0 + cwid + 3 * dpr, y0 + 1 * dpr); c.lineTo(x0 + cwid + 3 * dpr, y0 + chei - 1 * dpr); c.stroke();
  c.restore();
  // the signs, in lapis
  ink(0, 0, 0);
  let x = x0 + gs * 0.45;
  cols.forEach((col, k) => {
    const cw = ws[k] * gs, n = col.length;
    col.forEach((g, j) => {
      const gwid = (GW[g] || 0.85) * gs, sh = n > 1 ? 0.56 : 1, gx = x + (cw - gwid * sh) / 2, gy = y0 + chei / 2 - gs * 0.5 + (n > 1 ? (j * gs * 0.48 - 0.02 * gs) : 0);
      c.save(); c.translate(gx, gy); c.scale(gwid * sh, gs * sh); c.lineCap = 'round';
      GLY[g] && GLY[g](c);
      c.restore();
    });
    x += cw;
  });
  c.restore();
}
