<!doctype html>
<!--
  THE MUSICIAN OF NAKHT
  A figure drawn entirely in code as a simulated four-ink risograph print, after the
  banquet musicians painted in the tomb of Nakht at Thebes (18th Dynasty, c. 1400 BCE).
  She is an invented figure in the tomb's own conventions, not a portrait of anyone.
  Inks: Kohl Black, Red Ochre, Gold Ochre, Egyptian Blue (the painter's palette of the period).
  No images, no fonts, no libraries, no network. Canvas 2D only.
  Costume switch (top left): I dancer, II sheer gown, III linen dress, IV festival dress, V royal regalia.
  Controls: drag to pan, wheel or pinch to zoom, + / - zoom, arrow keys pan, 0 fits the sheet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>The Musician of Nakht</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a2622;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#lv{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));display:flex;gap:2px;padding:4px;background:#f4ecda;border:1px solid #2a2629;box-shadow:0 0 0 3px #f4ecda,0 0 0 4px #c4482f,0 8px 22px rgba(0,0,0,.4);font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;color:#2a2629;z-index:2}
#lv label{position:relative;display:flex;flex-direction:column;align-items:center;min-width:56px;padding:6px 8px 5px;cursor:pointer;line-height:1.1}
#lv input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
#lv b{font-weight:400;font-size:19px;letter-spacing:.06em}
#lv small{font-variant:small-caps;text-transform:lowercase;letter-spacing:.1em;font-size:11px;color:#245ca8}
#lv label:has(input:checked){background:#e8aa34}
#lv label:has(input:focus-visible){outline:2px solid #245ca8;outline-offset:1px}
@media (max-width:440px){#lv label{min-width:42px;padding:5px 4px 4px}#lv b{font-size:16px}#lv small{font-size:9px;letter-spacing:.04em}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lv" role="radiogroup" aria-label="Costume">
<label><input type="radio" name="lv" value="1" id="lv1"><b>I</b><small>Dancer</small></label>
<label><input type="radio" name="lv" value="2" id="lv2"><b>II</b><small>Sheer</small></label>
<label><input type="radio" name="lv" value="3" id="lv3" checked><b>III</b><small>Linen</small></label>
<label><input type="radio" name="lv" value="4" id="lv4"><b>IV</b><small>Festival</small></label>
<label><input type="radio" name="lv" value="5" id="lv5"><b>V</b><small>Royal</small></label>
</div>
<script>
'use strict';
/* ======================================================================
   1. PRESS: inks, paper, seeded randomness, noise
   ====================================================================== */
const TAU = Math.PI * 2, D2R = Math.PI / 180, C30 = Math.cos(Math.PI / 6);
// Four spot inks. a = screen angle (deg), o = misregistration of the drum (sheet units).
const INKS = [
  { n: 'Kohl Black',    hex: '#2a2629', c: [42, 38, 41],   a: 45, o: [0, 0] },
  { n: 'Red Ochre',     hex: '#c4482f', c: [196, 72, 47],  a: 75, o: [0.9, -0.55] },
  { n: 'Gold Ochre',    hex: '#e8aa34', c: [232, 170, 52], a: 0,  o: [-0.65, 0.8] },
  { n: 'Egyptian Blue', hex: '#245ca8', c: [36, 92, 168],  a: 15, o: [0.55, 0.95] },
];
const PAPER = [244, 236, 218];
const CELL = 2.1;                       // halftone cell, sheet units
const ABS = INKS.map(k => k.c.map(v => 1 - v / 255));

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;

const NS = 256, NM = 255, NZ = new Float32Array(NS * NS);
(function () {
  const r = mulberry(1979);
  const oct = [[64, 0.34], [32, 0.24], [16, 0.17], [8, 0.12], [4, 0.08], [2, 0.05]];
  for (const [P, w] of oct) {
    const L = NS / P, g = new Float32Array(L * L);
    for (let i = 0; i < g.length; i++) g[i] = r();
    for (let y = 0; y < NS; y++) {

        const a = g[(y0 % L) * L + x0 % L], b = g[(y0 % L) * L + (x0 + 1) % L];

  for (const v of NZ) { lo = Math.min(lo, v); hi = Math.max(hi, v); }

function nz(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const x0 = xi & NM, y0 = yi & NM, x1 = (x0 + 1) & NM, y1 = (y0 + 1) & NM;
  const a = NZ[y0 * NS + x0], b = NZ[y0 * NS + x1], c = NZ[y1 * NS + x0], d = NZ[y1 * NS + x1];

for (let i = 0; i < 1024; i++) COS[i] = Math.cos(i / 1024 * TAU);

/* ======================================================================

     A.rgb = Lapis, Carnelian, Ochre      B.r = Turquoise, B.g = object mask
   A knock-out fill paints every channel (so it erases what is behind it);
   an overprint uses 'lighter' on only its own channels.
   shade() turns those separations into a printed sheet: per-ink rotated
   amplitude-modulated dot screens with jitter, drum misregistration,
   uneven density, dropout in solids, multiply over grained cream paper.
   ====================================================================== */
function shade(A, B, wA, m, out, w, h, ox, oy, p, sprite, alpha) {

  const dm = cpx < 1.6 ? 0 : cpx > 3.4 ? 1 : (cpx - 1.6) / 1.8;   // dots vs. averaged tone
  const K = Math.max(1, cpx * 0.6);                                 // dot edge sharpness
  const ca = [], sa = [], sx = [], sy = [];
  for (let k = 0; k < 4; k++) {
    const a = INKS[k].a * D2R;
    ca[k] = Math.cos(a) / CELL; sa[k] = Math.sin(a) / CELL;
    sx[k] = Math.round(INKS[k].o[0] * p); sy[k] = Math.round(INKS[k].o[1] * p);
  }
  const o = out.data, ow = sprite ? w * 2 : w;
  for (let j = 0; j < h; j++) {
    const wy = oy + (j + 0.5) * inv;
    for (let i = 0; i < w; i++) {
      const wx = ox + (i + 0.5) * inv;
      let r = 1, g = 1, b = 1, any = 0;
      if (sprite) {   // most of a sprite's box is empty: skip it fast
        const q0 = (j * ow + i) * 4, mk0 = B[((j + m) * wA + i + m) * 4 + 1];
        let e = mk0;
        for (let k = 0; k < 4 && !e; k++) { const idx = ((j + m - sy[k]) * wA + (i + m - sx[k])) * 4; e = k < 3 ? A[idx + k] > 2 : B[idx] > 2; }
        if (!e) { o[q0 + 3] = 0; o[q0 + w * 4 + 3] = 0; continue; }
      }

        let cc = c;

          const iu = Math.floor(u + 0.5), iv = Math.floor(v + 0.5);
          const hh = hash3(iu, iv, k);

          const q = nz(wx * 0.5 + k * 97, wy * 0.5 + k * 13) * 0.55 + nz(wx * 2.4 + k * 7, wy * 2.4 + k * 41) * 0.45;

      const pg = 0.955 + 0.045 * nz(wx * 1.9, wy * 1.9) + 0.03 * (nz(wx * 0.21 + 90, wy * 0.21 + 30) - 0.5);
      if (!sprite) {
        const q = (j * ow + i) * 4;
        o[q] = PAPER[0] * pg * r; o[q + 1] = PAPER[1] * pg * g; o[q + 2] = PAPER[2] * pg * b; o[q + 3] = 255;
      } else {
        const mk = B[((j + m) * wA + i + m) * 4 + 1] / 255 * alpha;
        const q = (j * ow + i) * 4, q2 = q + w * 4;
        o[q] = PAPER[0] * pg * r; o[q + 1] = PAPER[1] * pg * g; o[q + 2] = PAPER[2] * pg * b; o[q + 3] = mk * 255;
        o[q2] = 255 * r; o[q2 + 1] = 255 * g; o[q2 + 2] = 255 * b; o[q2 + 3] = any ? (1 - mk) * 255 : 0;

  }
}

/* ======================================================================
   3. PEN: a display list of inked polygons, with hand-drawn wobble.
   Layout randomness is seeded per scene; wobble is seeded per scene,
   per op and per boil variant, so the three variants differ only in
   the hand, never in the drawing.
   ====================================================================== */
const LINE = [1, 0, 0, 0];
function inkStr(i, ko) {
  const A = 'rgb(' + (i[0] * 255 | 0) + ',' + (i[1] * 255 | 0) + ',' + (i[2] * 255 | 0) + ')';

const INKCACHE = new Map();
function inkS(i, ko) {
  const key = i[0].toFixed(3) + i[1].toFixed(3) + i[2].toFixed(3) + i[3].toFixed(3) + (ko ? 'k' : 'o');

function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t]; }

  const segs = closed ? n : n - 1;

  for (const c of [SA, SB]) { const x = c.x; x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.fillStyle = '#000'; x.fillRect(0, 0, wA, wA); x.setTransform(p, 0, 0, p, -w0 * p + m, -h0 * p + m); }
  const mx = m / p;
  replay(OPS[v] || OPS[0], SA.x, SB.x, w0 - mx, h0 - mx, w1 + mx, h1 + mx);
  const A = SA.x.getImageData(0, 0, wA, wA).data, B = SB.x.getImageData(0, 0, wA, wA).data;
  const c = mkCanvas(TS, TS, false), out = c.x.createImageData(TS, TS);
  shade(A, B, wA, m, out, TS, TS, w0, h0, p, false, 1);
  c.x.putImageData(out, 0, 0);
  tiles.set(tkey(L, tx, ty, v), { c, last: frameNo, L });
}
function evict() {
  if (tiles.size <= MAXT) return;
  const arr = [];
  for (const [k, t] of tiles) if (t.L > 1) arr.push([t.last, k]);
  arr.sort((a, b) => a[0] - b[0]);
  for (let i = 0; i < arr.length && tiles.size > MAXT * 0.85; i++) tiles.delete(arr[i][1]);
}

/* ======================================================================
   CAMERA AND INPUT: manual only. Nothing moves the camera but the viewer.
   ====================================================================== */
const cam = { x: SW / 2, y: SH / 2, z: 0.3 };
let vel = { x: 0, y: 0 }, anim = null, dirty = true, T0 = performance.now(), PRINT0 = -1;
const now = () => (performance.now() - T0) / 1000;
const ptrs = new Map();
let pinchD = 0, pinchM = null, lastMoveT = 0;
const fitZ = () => Math.min(W / SW, H / SH) * 0.94;
const minZ = () => fitZ() * 0.6, maxZ = () => 24;
function resize() {
  const small = Math.min(screen.width, screen.height) < 620;
  DPR = Math.min(window.devicePixelRatio || 1, small ? 2 : 3);
  const first = !W;
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  MAXT = small ? 340 : 760;
  if (first) cam.z = fitZ();
  cam.z = Math.max(minZ(), Math.min(maxZ(), cam.z));
  dirty = true;
}
function clampCam() { cam.x = Math.max(-SW * 0.1, Math.min(SW * 1.1, cam.x)); cam.y = Math.max(-SH * 0.1, Math.min(SH * 1.1, cam.y)); }
function zoomAt(sx, sy, f) {
  const z1 = Math.max(minZ(), Math.min(maxZ(), cam.z * f));
  const wx = (sx - W / 2) / cam.z + cam.x, wy = (sy - H / 2) / cam.z + cam.y;
  cam.z = z1; cam.x = wx - (sx - W / 2) / z1; cam.y = wy - (sy - H / 2) / z1;
  clampCam(); dirty = true;
}
// a short ease only in answer to a key press; the viewer always starts it
function ease(to, dur) { anim = { a: { x: cam.x, y: cam.y, z: cam.z }, b: to, t0: now(), d: dur }; }
cv.addEventListener('pointerdown', (e) => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); anim = null; vel.x = vel.y = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); pinchM = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
});
cv.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  const T = now(), dt = Math.max(0.008, T - lastMoveT); lastMoveT = T;
  if (ptrs.size === 1) {
    cam.x -= dx / cam.z; cam.y -= dy / cam.z; clampCam();
    vel.x = vel.x * 0.5 + (dx / dt) * 0.5; vel.y = vel.y * 0.5 + (dy / dt) * 0.5;
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinchD > 0) zoomAt(m.x, m.y, d / pinchD);
    cam.x -= (m.x - pinchM.x) / cam.z; cam.y -= (m.y - pinchM.y) / cam.z; clampCam();
    pinchD = d; pinchM = m; vel.x = vel.y = 0;
  }
  dirty = true;
});
function endPtr(e) {
  if (!ptrs.delete(e.pointerId)) return;
  if (now() - lastMoveT > 0.08) vel.x = vel.y = 0;
  if (ptrs.size === 1) { pinchD = 0; vel.x = vel.y = 0; }
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', (e) => {
  e.preventDefault(); anim = null; vel.x = vel.y = 0;
  const k = e.deltaMode === 1 ? 0.06 : e.deltaMode === 2 ? 0.5 : 0.0018;
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * k * (e.ctrlKey ? 2.5 : 1)));
}, { passive: false });
addEventListener('keydown', (e) => {
  const k = e.key;
  const pan = (dx, dy) => ease({ x: cam.x + dx * W * 0.2 / cam.z, y: cam.y + dy * H * 0.2 / cam.z, z: cam.z }, 0.3);
  const zm = (f) => ease({ x: cam.x, y: cam.y, z: Math.max(minZ(), Math.min(maxZ(), cam.z * f)) }, 0.3);
  if (k === 'ArrowLeft') pan(-1, 0); else if (k === 'ArrowRight') pan(1, 0);
  else if (k === 'ArrowUp') pan(0, -1); else if (k === 'ArrowDown') pan(0, 1);
  else if (k === '+' || k === '=') zm(1.5); else if (k === '-' || k === '_') zm(1 / 1.5);
  else if (k === '0') ease({ x: SW / 2, y: SH / 2, z: fitZ() }, 0.6);
  else return;
  e.preventDefault();
});
addEventListener('resize', resize);

/* ======================================================================
   FRAME LOOP
   ====================================================================== */
let PAPAT = null, boilLast = -1, lastT = 0;
const smooth = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame() {
  requestAnimationFrame(frame);
  const T = now(), dt = Math.min(0.1, T - lastT); lastT = T; frameNo++;
  if (!ptrs.size && (Math.abs(vel.x) > 2 || Math.abs(vel.y) > 2)) {
    cam.x -= vel.x * dt / cam.z; cam.y -= vel.y * dt / cam.z; clampCam();
    const d = Math.pow(0.04, dt); vel.x *= d; vel.y *= d; dirty = true;
  } else if (!ptrs.size) vel.x = vel.y = 0;
  if (anim) {
    const k = Math.min(1, (T - anim.t0) / anim.d), e = smooth(k);
    cam.z = Math.exp(Math.log(anim.a.z) + (Math.log(anim.b.z) - Math.log(anim.a.z)) * e);
    cam.x = anim.a.x + (anim.b.x - anim.a.x) * e; cam.y = anim.a.y + (anim.b.y - anim.a.y) * e;
    clampCam(); dirty = true; if (k >= 1) anim = null;
  }
  const boil = Math.floor(T * 3) % 3;
  if (boil !== boilLast) { boilLast = boil; dirty = true; }
  const p = cam.z * DPR;
  const L = Math.max(0, Math.min(LMAX, Math.ceil(Math.log2(p / 0.25) - 0.3)));
  const pL = lvlP(L), v = L >= 2 ? boil : 0;
  const vw = W / cam.z, vh = H / cam.z, vr = [cam.x - vw / 2, cam.y - vh / 2, cam.x + vw / 2, cam.y + vh / 2];
  const sx0 = Math.max(0, Math.floor(vr[0] * pL / TS)), sy0 = Math.max(0, Math.floor(vr[1] * pL / TS));
  const sx1 = Math.min(Math.ceil(SW * pL / TS) - 1, Math.floor(vr[2] * pL / TS)), sy1 = Math.min(Math.ceil(SH * pL / TS) - 1, Math.floor(vr[3] * pL / TS));
  // bake what is visible, nearest the centre first, under a time budget
  const need = [], ccx = cam.x * pL / TS, ccy = cam.y * pL / TS;
  for (let ty = sy0; ty <= sy1; ty++) for (let tx = sx0; tx <= sx1; tx++) {
    const t = tiles.get(tkey(L, tx, ty, v));
    if (t) t.last = frameNo; else need.push([Math.hypot(tx + 0.5 - ccx, ty + 0.5 - ccy), L, tx, ty, v]);
  }
  if (!need.length && L >= 2) for (let ty = sy0; ty <= sy1; ty++) for (let tx = sx0; tx <= sx1; tx++) for (let w = 0; w < 3; w++)
    if (!tiles.has(tkey(L, tx, ty, w))) need.push([100 + Math.hypot(tx - ccx, ty - ccy), L, tx, ty, w]);
  need.sort((a, b) => a[0] - b[0]);
  const t0 = performance.now(), budget = ptrs.size || anim ? 7 : 12;
  let baked = 0;
  for (const n of need) { if (performance.now() - t0 > budget && baked) break; bakeTile(n[1], n[2], n[3], n[4]); baked++; dirty = true; }
  evict();
  const printing = PRINT0 >= 0 && T - PRINT0 < 2.6;
  if (!dirty && !printing) return;
  dirty = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#2a2622'; ctx.fillRect(0, 0, cv.width, cv.height);
  const S = cam.z * DPR, ox = W * DPR / 2 - cam.x * S, oy = H * DPR / 2 - cam.y * S;
  const X = (wx) => Math.round(wx * S + ox), Y = (wy) => Math.round(wy * S + oy);
  ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(X(16), Y(22), X(SW + 16) - X(16), Y(SH + 22) - Y(22));
  if (!PAPAT) {
    const g = mkCanvas(NS, NS, false), im = g.x.createImageData(NS, NS);
    for (let i = 0; i < NS * NS; i++) { const pg = 0.955 + 0.045 * NZ[i]; im.data[i * 4] = PAPER[0] * pg; im.data[i * 4 + 1] = PAPER[1] * pg; im.data[i * 4 + 2] = PAPER[2] * pg; im.data[i * 4 + 3] = 255; }
    g.x.putImageData(im, 0, 0); PAPAT = ctx.createPattern(g, 'repeat');
  }
  PAPAT.setTransform(new DOMMatrix([S / 1.9, 0, 0, S / 1.9, ox, oy]));
  ctx.fillStyle = PAPAT; ctx.fillRect(X(0), Y(0), X(SW) - X(0), Y(SH) - Y(0));
  ctx.save();
  ctx.beginPath();
  if (printing) {   // the sheet comes off the drum once, top to bottom
    const h = SH * smooth(Math.max(0, Math.min(1, (T - PRINT0) / 2.4)));
    ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(SW), Y(0));
    for (let k = 12; k >= 0; k--) ctx.lineTo(X(SW * k / 12), Y(h + Math.sin(k * 1.7) * 10));
    ctx.closePath();
  } else ctx.rect(X(0), Y(0), X(SW) - X(0), Y(SH) - Y(0));
  ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const tsW = TS / pL;
  for (let ty = sy0; ty <= sy1; ty++) for (let tx = sx0; tx <= sx1; tx++) {
    const dx0 = X(tx * tsW), dy0 = Y(ty * tsW), dx1 = X((tx + 1) * tsW), dy1 = Y((ty + 1) * tsW);
    let t = tiles.get(tkey(L, tx, ty, v));
    if (!t) for (let w = 0; w < 3 && !t; w++) t = tiles.get(tkey(L, tx, ty, w));
    if (t) { ctx.drawImage(t.c, 0, 0, TS, TS, dx0, dy0, dx1 - dx0, dy1 - dy0); continue; }
    for (let l = L - 1; l >= 0; l--) {
      const sh = L - l, px = tx >> sh, py = ty >> sh, pt = tiles.get(tkey(l, px, py, 0)) || tiles.get(tkey(l, px, py, 1)) || tiles.get(tkey(l, px, py, 2));
      if (pt) { const s = TS >> sh; ctx.drawImage(pt.c, (tx - (px << sh)) * s, (ty - (py << sh)) * s, s, s, dx0, dy0, dx1 - dx0, dy1 - dy0); break; }
    }
  }
  ctx.restore();
}
function start() {
  resize();
  cam.x = SW / 2; cam.y = SH / 2; cam.z = fitZ();
  setLevel(3);
  PRINT0 = now() + 0.3;
  requestAnimationFrame(frame);
}

// costume levels: each keeps its own display lists and tile cache, so switching back is instant
function setLevel(lv) {
  if (!OPSL[lv]) { LV = lv; OPSL[lv] = [0, 1, 2].map((v) => { const P = new Pen(2718, v, 1); drawSheet(P, mulberry(31)); return P.ops; }); TILESL[lv] = new Map(); }
  LV = lv; OPS = OPSL[lv]; tiles = TILESL[lv];
  for (const l of [0, 1]) { const pl = lvlP(l); for (let ty = 0; ty * TS < SH * pl; ty++) for (let tx = 0; tx * TS < SW * pl; tx++) if (!tiles.has(tkey(l, tx, ty, 0))) bakeTile(l, tx, ty, 0); }
  dirty = true;
}
for (const r of document.querySelectorAll('#lv input')) r.addEventListener('change', () => { if (r.checked) setLevel(+r.value); });
start();
</script>
